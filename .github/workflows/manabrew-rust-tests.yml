name: Manabrew Rust tests

on:
  pull_request:
    paths:
      - ".github/workflows/manabrew-rust-tests.yml"
      - "apps/manabrew/**/*.rs"
      - "apps/manabrew/**/Cargo.toml"
      - "apps/manabrew/**/Cargo.lock"
      - "apps/manabrew/**/rust-toolchain.toml"
      - "apps/manabrew/**/.cargo/config.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/manabrew-rust-tests.yml"
      - "apps/manabrew/**/*.rs"
      - "apps/manabrew/**/Cargo.toml"
      - "apps/manabrew/**/Cargo.lock"
      - "apps/manabrew/**/rust-toolchain.toml"
      - "apps/manabrew/**/.cargo/config.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manabot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/manabrew
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Run ManaBot regression tests
        run: cargo test --locked -p manabot --lib --no-default-features
      - name: Run relay regression tests
        run: cargo test --locked -p manabrew-server
