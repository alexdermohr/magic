name: Manabrew offline installer tests

on:
  pull_request:
    paths:
      - ".github/workflows/manabrew-offline-tests.yml"
      - "apps/manabrew/public/offline-setup.html"
      - "apps/manabrew/public/offline-sw.js"
      - "apps/manabrew/scripts/test-ipad-auto-upgrade.mjs"
      - "apps/manabrew/scripts/test-ipad-recovery-upgrade.mjs"
      - "apps/manabrew/scripts/test-ipad-offline-hash.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated browser harness
        run: |
          npm install --prefix "$RUNNER_TEMP/manabrew-browser" --no-save playwright@1.61.1
          "$RUNNER_TEMP/manabrew-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify offline upgrades
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/manabrew-browser/node_modules/playwright/index.mjs
        run: |
          node apps/manabrew/scripts/test-ipad-offline-hash.mjs
          node apps/manabrew/scripts/test-ipad-auto-upgrade.mjs
          node apps/manabrew/scripts/test-ipad-recovery-upgrade.mjs
