name: Deck validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-decks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ereignis-Commit ohne gespeicherte Zugangsdaten auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Die Merge-Base braucht bei PRs beide vollständigen Historien.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Deck-PRs von zentralen README-Änderungen trennen
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_deck_pr_scope.py
      - name: Validate current Commander lists and documented file references
        run: python3 scripts/validate_decks.py
      - name: Struktur, Archive und PR-Scope mit positiven und negativen Fällen testen
        run: |
          python3 - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover(
              "tests", pattern="test_*.py"
          )
          if suite.countTestCases() == 0:
              raise SystemExit("No deck-validation tests collected")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
