name: Deck validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-decks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate current Commander lists and documented file references
        run: python3 scripts/validate_decks.py
      - name: Test positive and negative validation cases
        run: python3 -m unittest discover -s tests -p 'test_validate_decks.py' -v
