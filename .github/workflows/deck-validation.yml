name: Deck validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-decks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate current Commander lists and documented file references
        run: python3 scripts/validate_decks.py
      - name: Test positive and negative validation cases
        run: |
          python3 - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover(
              "tests", pattern="test_validate_decks.py"
          )
          if suite.countTestCases() == 0:
              raise SystemExit("No deck-validation tests collected")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY