name: Validate Commander decks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-decks:
    name: validate-decks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check active decklists
        shell: bash
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          import sys

          basic = {
              "Plains", "Island", "Swamp", "Mountain", "Forest", "Wastes",
              "Snow-Covered Plains", "Snow-Covered Island",
              "Snow-Covered Swamp", "Snow-Covered Mountain",
              "Snow-Covered Forest",
          }
          # Oracle text exceptions to Commander singleton (Scryfall, 2026-10-17).
          # None means "any number"; fixed limits are enforced below.
          copy_limits = {
              "Cid, Timeless Artificer": None,
              "Dragon's Approach": None,
              "Hare Apparent": None,
              "Nazgûl": 9,
              "Persistent Petitioners": None,
              "Rat Colony": None,
              "Relentless Rats": None,
              "Seven Dwarves": 7,
              "Shadowborn Apostle": None,
              "Slime Against Humanity": None,
              "Sphinx's Approach": None,
              "Tempest Hawk": None,
              "Templar Knight": None,
          }
          decks = sorted(Path("decks").glob("*/current.txt"))
          errors = []
          if not decks:
              errors.append("No active Commander decklists found")
          for path in decks:
              counts = Counter()
              total = 0
              for number, raw in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  line = raw.strip()
                  if not line or line in {"Commander", "Deck"}:
                      continue
                  match = re.fullmatch(r"([1-9][0-9]*) (.+)", line)
                  if not match:
                      errors.append(f"{path}:{number}: invalid decklist line")
                      continue
                  qty = int(match.group(1))
                  name = match.group(2).strip()
                  total += qty
                  counts[name] += qty
              if total != 100:
                  errors.append(f"{path}: {total} cards, expected 100")
              for name, qty in counts.items():
                  if name in basic:
                      continue
                  limit = copy_limits.get(name, 1)
                  if limit is not None and qty > limit:
                      errors.append(f"{path}: {qty} copies of {name}, maximum {limit}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"Validated {len(decks)} active 100-card Commander decklists")
          PY
